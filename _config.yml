<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akshat Tripathi | Portfolio</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-indigo: #818cf8;
      --border-color: #334155;
      --badge-bg: rgba(56, 189, 248, 0.1);
      --badge-text: #38bdf8;
      --max-width: 1100px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
    }

    body {
      padding-top: 70px;
    }

    /* Navbar */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
    }

    .nav-container {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
    }

    .logo {
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--text-main);
      text-decoration: none;
    }

    .logo span {
      color: var(--accent-blue);
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--accent-blue);
    }

    /* Layout Containers */
    section {
      padding: 5rem 1.5rem;
      max-width: var(--max-width);
      margin: 0 auto;
    }

    .section-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 2.5rem;
      position: relative;
      display: inline-block;
    }

    .section-title::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 50%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-indigo));
      border-radius: 2px;
    }

    /* Hero Section */
    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-subtitle {
      color: var(--accent-blue);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }

    .hero-title {
      font-size: 3.25rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .hero-description {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 700px;
      margin-bottom: 2rem;
    }

    .hero-cta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
      color: #fff;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--accent-blue);
      transform: translateY(-2px);
    }

    /* Highlights / Stats Grid */
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }

    .stat-card i {
      font-size: 1.8rem;
      color: var(--accent-blue);
      margin-bottom: 0.5rem;
    }

    .stat-card h3 {
      font-size: 1.25rem;
      margin-bottom: 0.25rem;
    }

    .stat-card p {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    /* Skills Grid */
    .skills-category {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .skills-category h3 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--accent-blue);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .tag {
      background-color: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    /* Cards (Experience & Projects) */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .card:hover {
      border-color: var(--accent-blue);
      transform: translateY(-3px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .card-subtitle {
      color: var(--accent-blue);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .card-date {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .card-bullets {
      list-style-type: disc;
      padding-left: 1.25rem;
      color: var(--text-muted);
    }

    .card-bullets li {
      margin-bottom: 0.5rem;
    }

    .card-bullets li::marker {
      color: var(--accent-blue);
    }

    /* Contact Section & Footer */
    .contact-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 1), rgba(15, 23, 42, 1));
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 3rem 2rem;
      text-align: center;
    }

    .contact-card h2 {
      font-size: 2.25rem;
      margin-bottom: 1rem;
    }

    .contact-card p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 2rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero-title {
        font-size: 2.25rem;
      }
      .nav-links {
        display: none; /* Simplification for small mobile view */
      }
      .card-header {
        flex-direction: column;
      }
    }
  </style>
</head>
